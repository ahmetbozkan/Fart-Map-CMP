name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # The action lists the pull request's commits through the API, which needs pull-requests: read
    # (the workflow-level permissions block above grants contents: read only).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings go to the job summary and the exit code; PR comments would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: No tracked config or secret files
        run: scripts/check-no-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Doc references resolve
        run: bash scripts/check-doc-links.sh

  android:
    name: Android build, shared tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject Firebase configs
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_SERVICE_INFO_PLIST_DEV: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
          GOOGLE_SERVICE_INFO_PLIST_PROD: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
        run: scripts/inject-config.sh --require-all
      - name: Build and test
        # detekt = static analysis (no swallowed errors, Compose rules); testAndroidHostTest includes the Konsist architecture tests.
        run: ./gradlew detekt :androidApp:assembleDevDebug :androidApp:assembleProdDebug :shared:testAndroidHostTest :androidApp:lintDevDebug --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            shared/build/reports/**
            androidApp/build/reports/**
            firebaseData/build/reports/**
            umbrella/build/reports/**
          if-no-files-found: ignore

  ios:
    name: iOS framework, shared tests, app build
    # Firebase iOS SDK 13 declares Swift tools 6.2, so the default Xcode 16.4 of macos-15 cannot resolve it.
    # macos-26 ships Xcode 26.x; pin the locally verified 26.4.1 (TechStack.md §3.1) with a fallback to the newest 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=/Applications/Xcode_26.4.1.app
          [ -d "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject Firebase configs
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_SERVICE_INFO_PLIST_DEV: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
          GOOGLE_SERVICE_INFO_PLIST_PROD: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
        run: scripts/inject-config.sh --require-all
      - name: Shared tests on the iOS simulator and framework link
        run: ./gradlew :shared:iosSimulatorArm64Test :umbrella:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme "FartMap Dev"
      - name: Build the iOS app (Debug-dev, simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme "FartMap Dev" -configuration Debug-dev \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -200

  backend:
    name: Backend build, lint, emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
